version: "3.9"

services:
  # ─── Go Backend Servers ────────────────────────────────────────────────────
  server1:
    build:
      context: ./server1
      dockerfile: ../Dockerfile.server
    container_name: api_server1
    environment:
      PORT: "8080"
      SERVER_NAME: "Server 1"
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  server2:
    build:
      context: ./server2
      dockerfile: ../Dockerfile.server
    container_name: api_server2
    environment:
      PORT: "8081"
      SERVER_NAME: "Server 2"
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  server3:
    build:
      context: ./server3
      dockerfile: ../Dockerfile.server
    container_name: api_server3
    environment:
      PORT: "8082"
      SERVER_NAME: "Server 3"
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─── Nginx Load Balancer ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: api_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
      server3:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: api_network
    driver: bridge
