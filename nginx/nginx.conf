worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/json;

    # ─── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_addr":"$upstream_addr",'
            '"upstream_response_time":"$upstream_response_time",'
            '"http_user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # ─── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ─── Gzip Compression ─────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types        text/plain text/css application/json application/javascript
                      text/xml application/xml application/xml+rss text/javascript;

    # ─── Rate Limiting ────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_status 429;

    # ─── Upstream: Go servers ─────────────────────────────────────────────────
    upstream go_servers {
        # least_conn: distribui para o servidor com menos conexões ativas
        least_conn;

        server 127.0.0.1:8080 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8081 weight=1 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8082 weight=1 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # ─── Main Server ──────────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Proxy timeouts
        proxy_connect_timeout  5s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # Proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_http_version 1.1;

        # ── Rate limit on all API routes ──────────────────────────────────────
        limit_req zone=api_limit burst=200 nodelay;

        # ── Application routes ────────────────────────────────────────────────
        location / {
            proxy_pass http://go_servers;

            # Retry on next upstream if current one fails
            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
        }

        # ── Nginx status (for monitoring) ─────────────────────────────────────
        location /nginx_status {
            stub_status;
            allow 127.0.0.1;
            deny all;
        }

        # ── Error pages ───────────────────────────────────────────────────────
        error_page 429 /error_429.json;
        error_page 502 503 504 /error_5xx.json;

        location = /error_429.json {
            internal;
            default_type application/json;
            return 429 '{"error":"too_many_requests","message":"Rate limit exceeded. Please slow down."}';
        }

        location = /error_5xx.json {
            internal;
            default_type application/json;
            return 502 '{"error":"bad_gateway","message":"All upstream servers are currently unavailable."}';
        }
    }
}
